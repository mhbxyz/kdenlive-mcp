name: Release

# Publishes only for maintainer-created tags vX.Y.Z (final) or vX.Y.ZaN/bN/rcN (pre-release).
#   pre-release tags: build → TestPyPI → verify install from TestPyPI → GitHub pre-release
#   final tags:       build → TestPyPI → verify install → PyPI → MCP Registry → GitHub release
# The exact files built in `build` are the ones published everywhere. No long-lived tokens:
# PyPI Trusted Publishing (OIDC) through the `testpypi` / `pypi` environments (tags v* only).
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  UV_VERSION: "0.9.26"
  MCP_PUBLISHER_VERSION: "v1.8.4"
  # Managed Python and package downloads sometimes time out on GitHub runners (#74).
  UV_HTTP_RETRIES: "8"
  UV_HTTP_TIMEOUT: "120"

jobs:
  build:
    name: Build and check artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false
      - name: Tag, version, server.json and changelog agree
        run: uv run --no-project python scripts/check_version.py "$GITHUB_REF_NAME"
      - id: meta
        name: Release metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
      - run: uv build --no-sources
      - run: uv run --no-project python scripts/check_dist.py dist
      - name: Smoke-test the exact artifacts
        run: |
          set -euo pipefail
          for kind in whl tar.gz; do
            venv="$RUNNER_TEMP/venv-$kind"
            uv venv --python 3.13 "$venv"
            VIRTUAL_ENV="$venv" uv pip install dist/*."$kind"
            (cd "$RUNNER_TEMP" && "$venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" "${{ steps.meta.outputs.version }}")
          done
          sha256sum dist/* | tee dist.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            dist.sha256
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mcp-kdenlive/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write      # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  verify-testpypi:
    name: Install from TestPyPI and smoke-test
    needs: [build, testpypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: built
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the TestPyPI release without trusting the test index for dependencies
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/v"
          pip="$RUNNER_TEMP/v/bin/pip"
          mkdir -p "$RUNNER_TEMP/dl"
          # TestPyPI can take minutes to list a new upload: wait up to 15 min with backoff (#82).
          python -I "$GITHUB_WORKSPACE/scripts/wait_for_index.py" --pip "$pip" --index https://test.pypi.org/simple/ \
            --dest "$RUNNER_TEMP/dl" --requirement "mcp-kdenlive==$VERSION" --max-wait 900
          # The file served by TestPyPI must be byte-identical to the one built in this run.
          (cd built/dist && sha256sum *.whl) > expected.sha256
          (cd "$RUNNER_TEMP/dl" && sha256sum -c "$GITHUB_WORKSPACE/expected.sha256")
          "$pip" install --no-deps "$RUNNER_TEMP"/dl/*.whl
          # Dependencies come from PyPI only (no --extra-index-url to the test index).
          "$RUNNER_TEMP/v/bin/python" -c "import importlib.metadata as m; print('\n'.join(m.requires('mcp-kdenlive') or []))" > reqs.txt
          "$pip" install -r reqs.txt
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/v/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" "$VERSION"

  pypi:
    name: Publish to PyPI
    needs: [build, verify-testpypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-kdenlive/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write      # Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  mcp-registry:
    name: Publish to the MCP Registry
    needs: [build, pypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write      # mcp-publisher login github-oidc (namespace io.github.mhbxyz/*)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher (Sigstore)
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error -o "$archive" "$base/$archive"
          curl --fail --location --silent --show-error -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate, then publish server.json
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
      - name: Check the public registry entry
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.mhbxyz/kdenlive-mcp" \
                | python3 -c "import json,sys,os; d=json.load(sys.stdin); v=os.environ['VERSION']; assert any((s.get('server') or s).get('version')==v for s in d.get('servers',[])), d"; then
              echo "registry lists io.github.mhbxyz/kdenlive-mcp $VERSION"; exit 0
            fi
            sleep 15
          done
          echo "registry entry not visible"; exit 1

  github-release:
    name: GitHub release
    needs: [build, verify-testpypi, pypi, mcp-registry]
    if: always() && needs.verify-testpypi.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') && (needs.mcp-registry.result == 'success' || needs.mcp-registry.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write      # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Create the release with notes, artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py "$VERSION" > notes.md
          {
            echo
            echo "## Artifacts"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            if [ "$PRERELEASE" = true ]; then
              echo "- Published to TestPyPI only: https://test.pypi.org/project/mcp-kdenlive/$VERSION/"
            else
              echo "- PyPI: https://pypi.org/project/mcp-kdenlive/$VERSION/ (with PEP 740 attestations)"
              echo "- MCP Registry: \`io.github.mhbxyz/kdenlive-mcp\` (https://registry.modelcontextprotocol.io/v0/servers?search=io.github.mhbxyz/kdenlive-mcp)"
            fi
            echo "- Build provenance: https://github.com/$GITHUB_REPOSITORY/attestations"
            echo '```'; cat dist.sha256; echo '```'
          } >> notes.md
          flags=(--verify-tag --title "mcp-kdenlive $VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* dist.sha256 "${flags[@]}" --repo "$GITHUB_REPOSITORY"
