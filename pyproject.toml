[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-kdenlive"
version = "0.1.0.dev0"
description = "Local-first MCP server to inspect, edit and render Kdenlive projects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manoah BERNIER" }]
keywords = ["mcp", "model-context-protocol", "kdenlive", "mlt", "video-editing", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/mhbxyz/kdenlive-mcp"
Issues = "https://github.com/mhbxyz/kdenlive-mcp/issues"
Source = "https://github.com/mhbxyz/kdenlive-mcp"

[project.scripts]
kdenlive-mcp = "mcp_kdenlive.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "anyio>=4.9",
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest-timeout>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kdenlive"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
    "integration: needs real Kdenlive/MLT/FFmpeg installations (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "PL"]
ignore = [
    "PLR2004",  # magic values in comparisons are fine in tests and status tables
    "PLR0913",  # too many arguments
    "PLR0917",  # MCP tool signatures mirror their JSON schema
    "RUF001",   # ambiguous unicode in strings (ellipsis is intentional)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S108", "PLC0415", "PTH"]
"scripts/**" = ["S101", "S603", "S607", "T201", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
